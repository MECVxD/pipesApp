<p-panel header="Pipes Númericos" class="p-1">
  <p>
    Pipe incluídos en Angular - Usualmente en el Common Module
  </p>
</p-panel>
<div class="grid">
  <div class="col-12 md:col-4">
    <p-card header="Ventas Netas" subheader="del presente año">
      <i class="pi pi-dollar"></i>
      {{ totalSells | number:'1.2-2' }}
    </p-card>
  </div>
  <div class="col-12 md:col-4">
    <p-card header="Ventas Brutas" subheader="del presente año">
      {{ totalSells + 1235 | currency:'MXN':'symbol-narrow':'1.0-4' }}
    </p-card>
  </div>
  <div class="col-12 md:col-4">
    <p-card header="Ganancia porcentual" subheader="del presente año">
      {{ percent | percent:'2.2-2' }}
    </p-card>
  </div>
</div>
